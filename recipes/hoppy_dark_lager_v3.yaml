name: Hoppy dark lager
version: 1.3
batch_size_l: 9.0
boil_time_min: 60
target_og_plato: 13
target_ibu: 20.0

mash_fermentables:
  - name: Best a-xl
    percent: 80
  - name: Caramunich 2
    percent: 10
  - name: Munich II
    percent: 5
  - name: Carafa special 2
    percent: 5

fermentor_fermentables:
 
boil_hops:
  - name: Saaz
    percent: 100
    boil_time_min: 60

dry_hops:
  - name: Idaho 7
    amount_g_per_l: 4.0
    contact_time_days: 3
  - name: Simco
    amount_g_per_l: 2.5
    contact_time_days: 3

ions:
  - name: Chloride
    salt_name: Calcium chloride
    amount_mg_per_l: 50.0
  - name: Sulfate
    salt_name: Calcium sulfate
    amount_mg_per_l: 50.0

comments:
  - "11 plato after mash, 14 plato after boil. pH around 5.2"